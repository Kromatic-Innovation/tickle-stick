name: CI

# Actions pinned to full commit SHAs (not mutable tags), consistent with
# release.yml's policy: a compromised maintainer can retag `v6`/`v3` and push
# code into a workflow. Comment after each pin records the tag at pin time.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage (thresholds enforced)
        if: matrix.node-version == 22
        run: npm run coverage

  public-safe-lint:
    name: org-agnostic public-safety shapes (local paths, bare issue refs, +alias emails)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No secrets, no org-specific config, no checkout beyond this repo's
      # own tree. This step runs identically on a fork PR. Script is copied
      # byte-identical from code-workspace-config's canonical template —
      # do not hand-edit; changes go to the canonical source (tickle-stick#130).
      - name: Run public-safe-lint scan
        run: bash .github/public-safe-lint.sh .

  ci-required:
    name: CI Required
    needs: [lint-test, public-safe-lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate CI result
        env:
          LINT_TEST_RESULT: ${{ needs.lint-test.result }}
          PUBLIC_SAFE_LINT_RESULT: ${{ needs.public-safe-lint.result }}
        run: |
          echo "lint-test=$LINT_TEST_RESULT"
          echo "public-safe-lint=$PUBLIC_SAFE_LINT_RESULT"
          # `success` → all matrix legs ran and passed.
          # `skipped` → job did not need to run (e.g. duplicate/no-op path).
          # anything else (failure/cancelled) → fail the gate.
          FAIL=0
          for result in "$LINT_TEST_RESULT" "$PUBLIC_SAFE_LINT_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) FAIL=1 ;;
            esac
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "::error::A required CI job did not report green — failing the aggregate gate."
            exit 1
          fi
          echo "CI Required: green (lint-test=$LINT_TEST_RESULT, public-safe-lint=$PUBLIC_SAFE_LINT_RESULT)"
