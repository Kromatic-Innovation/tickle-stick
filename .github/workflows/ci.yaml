name: CI

# Actions pinned to full commit SHAs (not mutable tags), consistent with
# release.yml's policy: a compromised maintainer can retag `v6`/`v3` and push
# code into a workflow. Comment after each pin records the tag at pin time.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage (thresholds enforced)
        if: matrix.node-version == 22
        run: npm run coverage

  ci-required:
    name: CI Required
    needs: [lint-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate CI result
        env:
          LINT_TEST_RESULT: ${{ needs.lint-test.result }}
        run: |
          echo "lint-test=$LINT_TEST_RESULT"
          # `success` → all matrix legs ran and passed.
          # `skipped` → job did not need to run (e.g. duplicate/no-op path).
          # anything else (failure/cancelled) → fail the gate.
          case "$LINT_TEST_RESULT" in
            success|skipped)
              echo "CI Required: green (lint-test=$LINT_TEST_RESULT)"
              exit 0
              ;;
            *)
              echo "::error::CI job result '$LINT_TEST_RESULT' is not green — failing the aggregate gate."
              exit 1
              ;;
          esac
