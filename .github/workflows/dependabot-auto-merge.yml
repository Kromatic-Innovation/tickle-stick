name: Dependabot auto-merge

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge eligible Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        # SHA-pinned per docs/security-posture.md §3.1 — this workflow holds
        # contents:write + pull-requests:write, exactly the case the pin
        # policy protects. Comment records the tag at pin time.
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide eligibility
        id: gate
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPS: ${{ steps.meta.outputs.dependency-names }}
        run: |
          # Policy (see docs/security-posture.md §3.1 and SECURITY.md):
          #
          # tickle-stick is an OSS npm library. The runtime surface is
          # the two production deps: `yaml` (config parser) and `zod`
          # (input validation). Both are on the live request path for
          # any consumer. Hold their minors for review even though CI
          # is green — these are exactly the packages where a behavior
          # shift breaks downstream consumers silently.
          #
          #   - Auto-merge all patch updates (CI-gated).
          #   - Auto-merge minor updates EXCEPT yaml or zod.
          #   - Do NOT auto-merge major updates — those follow §3.2.
          HOLD_LIST="yaml zod"

          echo "update-type: $UPDATE_TYPE"
          echo "deps: $DEPS"

          case "$UPDATE_TYPE" in
            version-update:semver-patch)
              echo "eligible=true" >> "$GITHUB_OUTPUT"
              echo "reason=patch update" >> "$GITHUB_OUTPUT"
              ;;
            version-update:semver-minor)
              IFS=',' read -ra DEP_ARR <<< "$DEPS"
              HOLD_HIT=""
              for d in "${DEP_ARR[@]}"; do
                dep="$(echo "$d" | xargs)"
                dep_lc="$(echo "$dep" | tr '[:upper:]' '[:lower:]')"
                for h in $HOLD_LIST; do
                  h_lc="$(echo "$h" | tr '[:upper:]' '[:lower:]')"
                  if [ "$dep_lc" = "$h_lc" ]; then
                    HOLD_HIT="$dep"
                    break 2
                  fi
                done
              done
              if [ -n "$HOLD_HIT" ]; then
                echo "eligible=false" >> "$GITHUB_OUTPUT"
                echo "reason=minor update touches hold-list package: $HOLD_HIT" >> "$GITHUB_OUTPUT"
              else
                echo "eligible=true" >> "$GITHUB_OUTPUT"
                echo "reason=minor update (no hold-list package)" >> "$GITHUB_OUTPUT"
              fi
              ;;
            version-update:semver-major)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "reason=major update — see docs/security-posture.md §3.2" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "eligible=false" >> "$GITHUB_OUTPUT"
              echo "reason=unknown update-type: $UPDATE_TYPE" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # tickle-stick#151. Enable auto-merge under an App token, NOT the default
      # `GITHUB_TOKEN`. A push made with `GITHUB_TOKEN` does not trigger further
      # workflow runs, so every tip landed by this step arrived on develop with
      # no `CI Required` check-run at all and `promote-main.yml`'s `ci_green`
      # gate had nothing to read. Enabling auto-merge under an App identity
      # makes the eventual merge push a normal, workflow-triggering push, so
      # `ci.yaml`'s `push: [develop]` run stamps the tip the usual way.
      #
      # PROVISIONING PREREQUISITE — see the operator follow-up linked from
      # tickle-stick#151. `PROMOTION_BOT_TOKEN` currently exists as an
      # ORGANIZATION ACTIONS secret, and that store is the wrong one for this
      # workflow: "When a Dependabot event triggers a workflow, the only
      # secrets available to the workflow are Dependabot secrets. GitHub
      # Actions secrets are not available."
      # (docs.github.com/en/code-security/dependabot/troubleshooting-dependabot
      #  /troubleshooting-dependabot-on-github-actions#accessing-secrets)
      # The same doc's recommended remedy is to store the token under the SAME
      # NAME in both stores, which is exactly what the follow-up asks for.
      # Until the Dependabot-store copy exists, `secrets.PROMOTION_BOT_TOKEN`
      # resolves to the empty string here, so the step falls back to
      # `GITHUB_TOKEN` and warns loudly rather than failing auth and leaving
      # Dependabot PRs to pile up unmerged. The fallback is today's behaviour
      # exactly — it cannot regress anything — and the fix activates by itself,
      # with no further code change, the moment the secret is provisioned.
      - name: Enable auto-merge (squash)
        if: steps.gate.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          USING_APP_TOKEN: ${{ secrets.PROMOTION_BOT_TOKEN != '' }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          if [ "$USING_APP_TOKEN" = "true" ]; then
            echo "Merge identity: PROMOTION_BOT_TOKEN (push will trigger CI on develop)."
          else
            echo "::warning::PROMOTION_BOT_TOKEN is not visible to this Dependabot-triggered run, so auto-merge falls back to GITHUB_TOKEN and the resulting develop tip will carry no 'CI Required' check-run (tickle-stick#151). Store PROMOTION_BOT_TOKEN as a DEPENDABOT secret (Settings > Secrets and variables > Dependabot) under the same name as the existing Actions secret."
          fi
          echo "Enabling auto-merge: $REASON"
          gh pr merge --auto --squash "$PR_URL"

      - name: Record skip reason
        if: steps.gate.outputs.eligible != 'true'
        env:
          REASON: ${{ steps.gate.outputs.reason }}
        run: echo "Auto-merge skipped — $REASON"
