name: OSS Readiness

# Deterministic OSS-readiness gate. Composes existing, well-known tools rather
# than reimplementing checks (see #99, refs hestia#583/#552):
#   - community/license health-file presence  (the "REUSE (license+community
#     files)" intent, adapted: full REUSE SPDX-header linting is out of scope
#     for this repo and would require per-file SPDX annotation)
#   - Gitleaks                                (secret scanning)
#   - npm packaging hygiene                   (the npm-ecosystem equivalent of
#     the Python `pyroma`/`twine check` the source issue named — tickle-stick
#     is a pure npm/TypeScript package, so `npm pack`/`npm publish --dry-run`
#     validate the publishable artifact instead)
#
# Actions pinned to full commit SHAs (not mutable tags), consistent with
# ci.yaml / release.yml: a compromised maintainer can retag `v6`/`v3` and push
# code into a workflow. Comment after each pin records the tag at pin time.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  oss-readiness:
    name: OSS readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Use Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Community & license health files present
        run: |
          set -euo pipefail
          missing=0
          for f in LICENSE README.md CODE_OF_CONDUCT.md CONTRIBUTING.md SECURITY.md; do
            if [ -f "$f" ]; then
              echo "  ok  $f"
            else
              echo "::error file=$f::required OSS community/license file is missing"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more required OSS community/license files are missing."
            exit 1
          fi
          echo "All required OSS community/license files are present."

      - name: Secret scan (Gitleaks)
        env:
          # Pinned Gitleaks release. Run the binary directly rather than the
          # marketplace action to avoid the action's org-license gate and to
          # keep the tool version explicit (no mutable action tag).
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "$url" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          # --no-git scans the working tree (robust against shallow PR checkouts).
          /tmp/gitleaks detect --no-git --source . --redact --no-banner

      - name: Packaging hygiene (npm)
        run: |
          set -euo pipefail
          # Validates that the publishable artifact is well-formed: package.json
          # correctness, files globs, bin/exports resolvability. Dry-run never
          # publishes.
          npm pack --dry-run
          npm publish --dry-run
