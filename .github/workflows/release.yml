name: Release

# Publishing is delegated to code-workspace-config's reusable
# npm-OIDC-publish workflow (cwc#1439) rather than inlining the publish steps
# here. This repo's release.yml was the reference that shared workflow was
# built from — the npm@11 trusted-publishing pin (trusted publishing needs
# npm >= 11.5.1; npm@latest is now npm 12, which dropped Node 20) was first
# discovered here on 2026-07-21 before being ported to panelist / ideate-core.
# Centralising the steps means a future npm gotcha (the npm@11 pin, the
# publishConfig strip, provenance gating) is fixed once in cwc and every
# caller inherits it.
#
# The reusable workflow pins its own actions to full commit SHAs (immutable);
# we pin the reusable workflow itself to `@main` per its documented caller
# contract. permissions are NOT inherited into a called workflow, so the
# caller job below must grant `id-token: write` or OIDC token minting +
# provenance attestation fail.
#
# tickle-stick is unscoped, has a `tsc` build, runs no tests at publish time,
# is public (provenance auto-attaches), and uses npm@11 — all of which are the
# reusable workflow's defaults, so only the dry-run wiring is passed here.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Publish with --dry-run (validate the pipeline without a real publish)."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Build + publish to npm (OIDC)
    permissions:
      contents: read
      id-token: write # npm provenance attestations via OIDC
    uses: Kromatic-Innovation/code-workspace-config/.github/workflows/npm-oidc-publish.yml@main
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
