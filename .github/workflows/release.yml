name: Release

# Actions pinned to full commit SHAs (not mutable tags). A compromised
# maintainer of any upstream action can retag `v6`/`release/v1`/etc. and
# push malicious code into our next release, which our trusted-publishing
# identity would then happily sign. SHA pins make action content
# immutable — upgrades are explicit PRs, not silent.
# Comment after each pin records the semver tag the SHA corresponded to
# at pin time, for human-readable version tracking.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build + publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write         # npm provenance attestations via OIDC
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1 — Node 20 ships npm 10.x,
      # which signs provenance attestations but doesn't perform the
      # OIDC↔registry token exchange. Pin to the npm 11 line: `npm@latest`
      # is now npm 12, which dropped Node 20 (requires node >=22) and fails
      # this step with EBADENGINE. npm 11.x still supports Node 20
      # (^20.17.0) and satisfies the >= 11.5.1 trusted-publishing floor.
      - name: Upgrade npm to support trusted publishing
        run: |
          npm install -g npm@11
          npm --version

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      # Trusted publishing fallback to NPM_TOKEN. The trusted publisher
      # is configured on npmjs.com (Kromatic-Innovation/tickle-stick →
      # release.yml) but the v0.4.0 release attempts kept failing with
      # ENEEDAUTH / 404 — npm 11.13's OIDC trusted-publishing detection
      # never fired despite `id-token: write`, `--provenance`, and a
      # cleaned `.npmrc`. See tickle-stick#38 for the full failure
      # analysis.
      #
      # Until that's resolved, this step uses a classic automation token
      # in the NPM_TOKEN repo secret. Provenance attestations still get
      # signed via OIDC (separate code path that already works) so the
      # supply-chain posture is mostly preserved.
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
