name: Release

# Actions pinned to full commit SHAs (not mutable tags). A compromised
# maintainer of any upstream action can retag `v6`/`release/v1`/etc. and
# push malicious code into our next release, which our trusted-publishing
# identity would then happily sign. SHA pins make action content
# immutable — upgrades are explicit PRs, not silent.
# Comment after each pin records the semver tag the SHA corresponded to
# at pin time, for human-readable version tracking.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build + publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write         # npm provenance attestations via OIDC
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm >= 11.5.1 — Node 20 ships npm 10.x,
      # which signs provenance attestations but doesn't perform the
      # OIDC↔registry token exchange.
      - name: Upgrade npm to support trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      # Default: trusted publishing via OIDC. Requires the `tickle-stick`
      # package to have a configured trusted publisher on npmjs.com that
      # references this repo + workflow file. No NPM_TOKEN secret needed.
      #
      # We explicitly remove the .npmrc files setup-node wrote. setup-node's
      # `registry-url` input writes both `~/.npmrc` and `$RUNNER_TEMP/.npmrc`
      # with `_authToken=${NODE_AUTH_TOKEN}` and exports a placeholder
      # (`XXXXX-XXXXX-XXXXX-XXXXX`) for NODE_AUTH_TOKEN. npm 11.5.1+ only
      # attempts OIDC trusted publishing when no auth token is configured;
      # the placeholder defeats that detection. Removing the .npmrc files
      # leaves npm's auth state empty so the OIDC token-exchange runs.
      - name: Publish to npm (trusted publishing)
        run: |
          rm -f ~/.npmrc "$RUNNER_TEMP/.npmrc"
          npm publish --provenance --access public --registry=https://registry.npmjs.org/
        # Fallback: if trusted publishing is not configured on npmjs.com,
        # comment out the step above and uncomment the block below. This
        # uses a classic automation token stored in the NPM_TOKEN repo
        # secret. Worse supply-chain posture (long-lived token), so
        # trusted publishing is strongly preferred.
        #
        # - name: Publish to npm (NPM_TOKEN fallback)
        #   run: npm publish --provenance --access public
        #   env:
        #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
