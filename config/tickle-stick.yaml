tickleStick:
  pipelines:
    demo:
      stages:
        - name: gather
          type: script
          command: "echo"
          args: ['[{"id": "demo-1", "source": "chat", "type": "message", "summary": "Hello world", "timestamp": "2026-03-25T10:00:00Z"}]']
          timeout: 5000

        - name: classify
          type: model
          provider: cheap
          systemPrompt: |
            You are the Tickle-Stick demo triage classifier. This is a public demo
            showing how agent cost hierarchies work.

            Classify the incoming item. Respond with ONLY a JSON object:
            {"classification": "routine"|"urgent"|"needs-reasoning", "response": "...", "confidence": 0.0-1.0}

            Rules:
            - "routine": Simple, factual questions. Answer directly.
            - "needs-reasoning": Complex, multi-part, or technical questions.
            - "urgent": Time-sensitive items needing immediate processing.
          confidenceThreshold: 0.7

        - name: reason
          type: model
          provider: expensive
          prompt: |
            Process these escalated items:
            {{items}}
            Provide detailed reasoning for each.
          input: "classified:needs-reasoning,classified:urgent"

  telemetry:
    enabled: true
    format: json
